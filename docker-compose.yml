services:
  postgres_db:
    image: postgres:15-alpine
    container_name: sod_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: audit_target_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d audit_target_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
